<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a2a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tramel Plan" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Tramel Family Calendar</title>
  <link rel="stylesheet" href="app.css?v=g">
</head>
<body>
  <header>
    <h1>Tramel Family Calendar</h1>
    <p>5:00 a.m. – 9:00 p.m. · Brandon, MS · 304 → 224 for the men</p>
    <p class="note" id="appVer">Build 2026-09-03g · tap a name</p>
    <div class="pills">
      <span class="pill dad" id="pillDad">Thomas</span>
      <span class="pill mom" id="pillMom">Mom</span>
      <span class="pill son" id="pillSon">Son</span>
    </div>
  </header>
  <main>
    <section id="view-today"></section>
    <section id="view-week" hidden></section>
    <section id="view-meals" hidden></section>
    <section id="view-shop" hidden></section>
    <section id="view-share" hidden></section>
  </main>
  <nav>
    <button class="active" data-view="today"><span>📅</span>Today</button>
    <button data-view="week"><span>🗓️</span>Week</button>
    <button data-view="meals"><span>🍽️</span>Meals</button>
    <button data-view="shop"><span>🛒</span>Shop</button>
    <button data-view="share"><span>📤</span>Share</button>
  </nav>
  <script src="app.js?v=g"></script>
</body>
</html>
